[project]
name = "codebase-research-agent"
version = "0.1.0"
description = "AI agent that answers technical questions about a GitHub repository by exploring its code."
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "djangorestframework",
    "psycopg[binary]",
    "dj-database-url",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-django",
    "mypy",
    "ruff",
    "pip-tools",
    "django-stubs[compatible-mypy]",
    "djangorestframework-stubs[compatible-mypy]",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "TCH", "RUF", "D"]
ignore = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]
exclude = ["migrations/"]

[tool.django-stubs]
django_settings_module = "config.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "-ra --strict-markers"
