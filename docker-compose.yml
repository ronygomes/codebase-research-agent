services:
  db:
    image: postgres:16.0
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345}
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME:-research_agent}
      PGDATA: /data/postgres
      # TZ is for GNU/Linux and PGTZ is for PostgreSQL
      TZ: 'UTC'
      PGTZ: 'UTC'
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/data/postgres

volumes:
  postgres_data:
